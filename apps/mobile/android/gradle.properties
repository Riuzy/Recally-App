org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Flutter 3.38 still targets the legacy AGP DSL. AGP 9 enables the new DSL by default,
# which the Flutter Gradle plugin does not support yet. Remove this once Flutter supports it.
android.newDsl=false

# google_sign_in_android 7.2.11 (the last version compatible with Flutter 3.38) still
# applies the kotlin-android plugin, which clashes with AGP 9 built-in Kotlin.
# Opt out of built-in Kotlin and apply the Kotlin plugin explicitly instead.
# Remove once Flutter/google_sign_in versions that support AGP 9 are in use.
android.builtInKotlin=false
